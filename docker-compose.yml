services:
  # Port 8001: RAG API (rag/src/rag.py)
  rag-service:
    build: .
    working_dir: /app/rag
    command: uvicorn src.rag:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      # Keep your Qdrant vector DB saved on your host machine
      - ./rag/qdrant_storage:/app/rag/qdrant_storage
    environment:
      - PYTHONPATH=/app/rag/src
    restart: unless-stopped

  # Port 8002: LLM Engine (backend/llm_service/main.py)
  llm-service:
    build: .
    working_dir: /app/backend
    command: uvicorn llm_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      # Keep your heavy .gguf model on the host so Docker doesn't duplicate it
      - ./backend/llm_service/models:/app/backend/llm_service/models
    restart: unless-stopped

  # Port 8000: Chat Router (backend/main.py)
  chat-service:
    build: .
    working_dir: /app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # Map the SQLite database files so chat history persists
      - ./backend/legal_llm.db:/app/backend/legal_llm.db
      - ./backend/legal_llm.db-shm:/app/backend/legal_llm.db-shm
      - ./backend/legal_llm.db-wal:/app/backend/legal_llm.db-wal
    environment:
      # Tell the router how to find the other two containers over Docker's internal network
      - RAG_SERVICE_URL=http://rag-service:8001
      - LLM_SERVICE_URLS=http://llm-service:8002
    restart: unless-stopped
    depends_on:
      - rag-service
      - llm-service
