services:
  # 1. Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./rag/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # 2. RAG Retrieval Service
  rag_service:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: legal-rag-service
    ports:
      - "8002:8002"
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped

  # 3. LLM Inference Service (Located inside backend/llm_service)
  llm_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-llm-service
    command: ["python", "llm_service/main.py"]
    ports:
      - "8001:8001"
    volumes:
      - ./backend/models:/app/models
    restart: unless-stopped

  # 4. Core FastAPI Backend & UI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_SERVICE_URL=http://llm_service:8001
      - RAG_SERVICE_URL=http://rag_service:8002
    depends_on:
      - llm_service
      - rag_service
    restart: unless-stopped
